<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>G4 Unit 3 居家單字尋寶 - 阿奇線上教學</title>
    <style>
        :root { 
            --primary: #8d6e63; /* 咖啡色調 */
            --accent: #e67e22; 
            --grid-bg: #f5f0e6; /* 淡淡咖啡色網格背景 */
            --bg: #fafafa;
            --found: #2ecc71;
        }
        
        body { font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; min-height: 100vh; color: var(--primary); }
        
        /* 使用說明頁面 */
        #instruction-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 100000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .instruction-card { background: white; padding: 40px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 500px; width: 85%; text-align: center; border: 3px solid var(--primary); }
        .start-btn { background: var(--primary); color: white; border: none; padding: 15px 50px; font-size: 22px; font-weight: bold; border-radius: 50px; cursor: pointer; margin-top: 20px; }
        
        /* 彩虹鋼印 Akey */
        .steel-stamp-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: none; z-index: 9999; opacity: 0.1; transform: rotate(-25deg); }
        .steel-stamp-text { font-size: 150px; font-weight: 900; background: linear-gradient(to right, red, orange, green, blue, purple); -webkit-background-clip: text; color: transparent; text-transform: uppercase; }

        .main-content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; width: 100%; }
        .game-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; margin-top: 20px; }
        
        /* 網格樣式 */
        #grid { display: grid; grid-template-columns: repeat(12, 42px); gap: 5px; background: var(--grid-bg); padding: 12px; border-radius: 15px; box-shadow: inset 0 0 10px rgba(0,0,0,0.05); }
        .cell { width: 42px; height: 42px; background: white; display: flex; justify-content: center; align-items: center; font-weight: 700; font-size: 22px; cursor: pointer; border-radius: 8px; transition: 0.2s; border: 1px solid #efebe9; user-select: none; }
        .cell.selected { background: var(--accent); color: white; }
        .cell.found { background: var(--found); color: white; }
        .cell.answer-key { background: #fd79a8; color: white; }
        
        @keyframes hint-blink { 0%, 100% { background: white; } 50% { background: #ffeaa7; } }
        .hint-blink { animation: hint-blink 0.8s infinite; }

        .panel { background: white; padding: 25px; border-radius: 20px; min-width: 340px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        
        /* 單字清單樣式 */
        .word-item { display: flex; align-items: center; margin: 12px 0; font-size: 19px; padding: 8px; border-bottom: 1px dashed #eee; justify-content: space-between; }
        .word-info { display: flex; align-items: center; flex-grow: 1; cursor: pointer; }
        .check-box { width: 22px; height: 22px; border: 2px solid var(--primary); border-radius: 4px; margin-right: 12px; display: flex; align-items: center; justify-content: center; transition: 0.3s; flex-shrink: 0; }
        .btn-reveal { background: none; border: none; cursor: pointer; font-size: 20px; color: var(--primary); padding: 5px; opacity: 0.6; }
        .btn-reveal:hover { opacity: 1; }

        .word-item.completed { color: #bbb; }
        .word-item.completed .check-box { background: var(--found); border-color: var(--found); }
        .word-item.completed .check-box::after { content: '✓'; color: white; font-weight: bold; font-size: 16px; }

        h1 { margin: 0; color: var(--primary); }
        .slogan { font-size: 14px; color: #999; margin-bottom: 10px; }
    </style>
</head>
<body>
    <audio id="bgMusic" loop>
        <source src="bg_music.mp3" type="audio/mpeg">
    </audio>

    <div id="instruction-overlay">
        <div class="instruction-card">
            <h2>🏠 G4 Unit 3 居家單字尋寶</h2>
            <p>A Key to Unlock the Gate for All</p>
            <ul style="text-align:left; line-height:2; color: #555;">
                <li>在網格中找出 7 個居家空間單字。</li>
                <li>點擊<strong>第一個</strong>與<strong>最後一個</strong>字母來圈選。</li>
                <li>勾選方框可獲得<strong>字首提示</strong>。</li>
                <li>點擊 🔍 可直接顯示答案。</li>
            </ul>
            <button class="start-btn" onclick="startGame()">START GAME</button>
        </div>
    </div>

    <div class="steel-stamp-overlay"><div class="steel-stamp-text">Akey</div></div>

    <div class="main-content">
        <h1>Word Search Puzzle</h1>
        <div class="slogan">阿奇線上教學 - G4 Class</div>
        <div class="game-container">
            <div id="grid"></div>
            <div class="panel">
                <h3 style="margin-top:0">單字清單</h3>
                <div id="word-ui-list"></div>
                <button style="width:100%;margin-top:20px;padding:12px;background:var(--primary);color:white;border:none;border-radius:8px;cursor:pointer;font-weight:bold;" onclick="location.reload()">重新排列網格</button>
            </div>
        </div>
    </div>

    <script>
        // 單字設定區 (對應老師的 G4 Unit 3 內容)
        const WORD_MAP = [
            { en: "BATHROOM", zh: "浴室" },
            { en: "BEDROOM", zh: "臥室" },
            { en: "DININGROOM", zh: "餐廳" },
            { en: "LIVINGROOM", zh: "客廳" },
            { en: "KITCHEN", zh: "廚房" },
            { en: "YARD", zh: "院子" },
            { en: "WHERE", zh: "在哪裡" }
        ];

        const WORDS = WORD_MAP.map(item => item.en);
        const SIZE = 12;
        let gridData = Array(SIZE).fill().map(() => Array(SIZE).fill(''));
        let wordPaths = {};
        let foundWords = new Set();
        let startCell = null;

        function startGame() { 
            // 1. 隱藏說明頁面
            document.getElementById('instruction-overlay').style.display = 'none'; 
            
            // 2. 啟動背景音樂 (音量 0.05 確保背景音樂不干擾教學)
            const music = document.getElementById('bgMusic');
            music.volume = 0.05; 
            music.play().catch(e => console.log("音樂播放被瀏覽器阻擋，需再次點擊頁面"));
            
            // 3. 歡迎語音
            speak("Let's find the words!");
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'en-US';
            msg.rate = 0.8;
            window.speechSynthesis.speak(msg);
        }

        // 生成遊戲網格邏輯
        function createGame() {
            const dirs = [[0,1],[1,0],[1,1],[0,-1],[-1,0],[-1,-1],[1,-1],[-1,1]];
            [...WORDS].sort((a,b) => b.length - a.length).forEach(word => {
                let placed = false;
                let attempts = 0;
                while(!placed && attempts < 100){
                    const d = dirs[Math.floor(Math.random()*dirs.length)];
                    const r = Math.floor(Math.random()*SIZE), c = Math.floor(Math.random()*SIZE);
                    if(canPlace(word,r,c,d)){
                        let path = [];
                        for(let i=0;i<word.length;i++) {
                            gridData[r+i*d[0]][c+i*d[1]] = word[i];
                            path.push({r: r+i*d[0], c: c+i*d[1]});
                        }
                        wordPaths[word] = path;
                        placed = true;
                    }
                    attempts++;
                }
            });
            // 填補隨機字母
            for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(!gridData[r][c]) gridData[r][c] = String.fromCharCode(65+Math.floor(Math.random()*26));
        }

        function canPlace(w,r,c,d){
            for(let i=0;i<w.length;i++){
                const nr=r+i*d[0], nc=c+i*d[1];
                if(nr<0||nr>=SIZE||nc<0||nc>=SIZE||(gridData[nr][nc]&&gridData[nr][nc]!==w[i])) return false;
            }
            return true;
        }

        function render(){
            const g = document.getElementById('grid');
            g.innerHTML = '';
            for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
                const div = document.createElement('div'); div.className='cell'; div.textContent=gridData[r][c];
                div.onclick=()=>handleSelect(r,c,div); div.dataset.r=r; div.dataset.c=c;
                g.appendChild(div);
            }
            const l = document.getElementById('word-ui-list');
            l.innerHTML = '';
            WORD_MAP.forEach(item => {
                const div = document.createElement('div'); div.className = 'word-item'; div.id = `box-${item.en}`;
                div.innerHTML = `
                    <div class="word-info" onclick="toggleHint('${item.en}')">
                        <div class="check-box" id="check-icon-${item.en}"></div>
                        <strong>${item.en}</strong> <span style="font-size:14px;margin-left:5px;">(${item.zh})</span>
                    </div>
                    <button class="btn-reveal" onclick="revealAnswer('${item.en}')">🔍</button>
                `;
                l.appendChild(div);
            });
        }

        function toggleHint(word) {
            if (foundWords.has(word)) return;
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('hint-blink'));
            const firstLetter = word[0];
            document.querySelectorAll('.cell').forEach(cell => {
                if (cell.textContent === firstLetter && !cell.classList.contains('found')) {
                    cell.classList.add('hint-blink');
                }
            });
            speak(word);
        }

        function revealAnswer(word) {
            if (foundWords.has(word)) return;
            wordPaths[word].forEach(p => {
                document.querySelector(`.cell[data-r='${p.r}'][data-c='${p.c}']`).classList.add('answer-key');
            });
            markFound(word);
        }

        function handleSelect(r,c,el){
            if(el.classList.contains('found')) return;
            if(!startCell){ 
                startCell={r,c,el}; 
                el.classList.add('selected'); 
            } else {
                const r1=startCell.r, c1=startCell.c, dist=Math.max(Math.abs(r-r1),Math.abs(c-c1));
                if (dist > 0) {
                    const sr=r===r1?0:(r-r1)/dist, sc=c===c1?0:(c-c1)/dist;
                    let str="", path=[];
                    for(let i=0;i<=dist;i++){ 
                        const currR = Math.round(r1+i*sr), currC = Math.round(c1+i*sc);
                        str+=gridData[currR][currC]; 
                        path.push({r:currR, c:currC}); 
                    }
                    if(WORDS.includes(str) && !foundWords.has(str)){
                        path.forEach(p=>{
                            const cell = document.querySelector(`.cell[data-r='${p.r}'][data-c='${p.c}']`);
                            cell.classList.remove('selected', 'answer-key', 'hint-blink');
                            cell.classList.add('found');
                        });
                        markFound(str);
                        speak(str);
                    }
                }
                startCell.el.classList.remove('selected'); startCell=null;
            }
        }

        function markFound(word) {
            foundWords.add(word);
            document.getElementById(`box-${word}`).classList.add('completed');
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('hint-blink'));
            
            if(foundWords.size === WORDS.length) {
                setTimeout(() => speak("Excellent! You found all the words!"), 500);
            }
        }

        createGame(); render();
    </script>
</body>
</html>
